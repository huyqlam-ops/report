name: Deploy a release to ACA

on:
  workflow_run:
    workflows:
      - "CI/CD - Build, Test, Release & Push Image"
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  id-token: write

env:
  IMAGE_NAME: report
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  CONTAINER_NAME: report

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: dev
      url: ${{ steps.deploy.outputs.fqdn }}

    steps:
      - name: Download version artifact
        uses: actions/download-artifact@v4
        with:
          name: release-version
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read version
        id: read_version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new revision to Azure Container Apps
        id: deploy
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --container-name ${{ env.CONTAINER_NAME }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.read_version.outputs.version }}

          FQDN=$(az containerapp show \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"

      - name: Print deployed version
        run: echo "Đã deploy image ${{ env.IMAGE_NAME }}:${{ steps.read_version.outputs.version }} lên Azure Container Apps"
